[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smarter-dia"
version = "1.2.0"
authors = [{ name = "ganidhu" }]
description = "Dia AI Intelligence & Sandbox Supercharger — unlock capabilities, sync skills, fix PATH, inject persona"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
smarter-dia = "smarter_dia.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["smarter_dia*"]

[tool.setuptools.package-data]
smarter_dia = ["patches/*.sb", "patches/*.md"]
